<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vaporswift — Episode 03 — Video overlay</title>
<style>
  /* ============================================================
     VIDEO OVERLAY — 1080 x 1440, transparent.
     Rendered with omitBackground so it can be composited straight
     onto the reframed 3:4 clip with ffmpeg. Same tokens as the deck.
     ============================================================ */

  @font-face{
    font-family:'Inter Variable';
    src:url('fonts/InterVariable.ttf') format('truetype-variations');
    font-weight:100 900; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'JetBrains Mono';
    src:url('fonts/JetBrainsMono-Regular.ttf') format('truetype');
    font-weight:400; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'JetBrains Mono';
    src:url('fonts/JetBrainsMono-Medium.ttf') format('truetype');
    font-weight:500; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'JetBrains Mono';
    src:url('fonts/JetBrainsMono-Bold.ttf') format('truetype');
    font-weight:700; font-style:normal; font-display:block;
  }

  :root{
    --paper:   #faf9f5;
    --accent:  #d97757;
    --accent2: #8FA97A;
    --M:   88px;
    --TOP: 84px;
    --BOT: 150px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ background:transparent; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
      'Helvetica Neue', 'Inter Variable', Inter, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .overlay{
    width:1080px; height:1440px; position:relative; overflow:hidden;
    background:transparent;
  }

  /* The clip travels from a dark twilight exterior to a bright warm interior,
     so the type needs its own ground at both ends — not just at the start. */
  .scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(to top,
        rgba(7,11,9,.92) 0%,
        rgba(7,11,9,.80) 20%,
        rgba(7,11,9,.30) 42%,
        rgba(7,11,9,.00) 58%),
      linear-gradient(to bottom,
        rgba(7,11,9,.55) 0%,
        rgba(7,11,9,.10) 16%,
        rgba(7,11,9,.00) 30%);
  }

  .brand{
    position:absolute; top:var(--TOP); left:var(--M);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:20px; font-weight:500; letter-spacing:.22em; text-transform:uppercase;
    color:var(--paper);
  }
  .brand span{ color:var(--accent); }

  .ep{
    position:absolute; top:var(--TOP); right:var(--M);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:20px; font-weight:500; letter-spacing:.18em; color:var(--accent);
  }

  .copy{ position:absolute; left:var(--M); right:var(--M); bottom:var(--BOT); }

  .kicker{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:23px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:var(--accent); margin-bottom:26px;
  }

  h1{
    font-size:86px; line-height:1.02; font-weight:600; letter-spacing:-.03em;
    color:var(--paper);
    text-shadow:0 2px 30px rgba(0,0,0,.55);
  }
  h1 em{ font-style:normal; color:var(--accent2); }

  /* The CTA is the job of this slide — it gets a chip so it survives a bright
     frame and reads as an instruction rather than a caption. */
  .cta{
    display:inline-flex; align-items:center; gap:18px;
    margin-top:40px; padding:20px 30px;
    border:2px solid var(--accent2);
    background:rgba(7,11,9,.55);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:27px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent2);
  }
  .cta .arrow{ font-size:31px; line-height:1; }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="scrim"></div>
  <div class="brand">VAPORSWIFT<span>.</span>MEDIA</div>
  <div class="ep">03</div>

  <div class="copy">
    <div class="kicker">The shot you can't hire</div>
    <h1>Drone. Through<br>the front door.<br><em>One unbroken take.</em></h1>
    <div class="cta">Swipe for the prompt <span class="arrow">→</span></div>
  </div>
</div>

</body>
</html>
