<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vaporswift — Still to Motion labels</title>
<style>
  /* Two transparent 1080x1440 label plates, composited onto the two segments
     of the comparison. Same tokens as the carousel deck. */

  @font-face{
    font-family:'Inter Variable';
    src:url('fonts/InterVariable.ttf') format('truetype-variations');
    font-weight:100 900; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'JetBrains Mono';
    src:url('fonts/JetBrainsMono-Regular.ttf') format('truetype');
    font-weight:400; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'JetBrains Mono';
    src:url('fonts/JetBrainsMono-Medium.ttf') format('truetype');
    font-weight:500; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'JetBrains Mono';
    src:url('fonts/JetBrainsMono-Bold.ttf') format('truetype');
    font-weight:700; font-style:normal; font-display:block;
  }

  :root{
    --paper:   #faf9f5;
    --accent:  #d97757;
    --accent2: #8FA97A;
    --M:   88px;
    --TOP: 84px;
    --BOT: 150px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:transparent; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
      'Helvetica Neue', 'Inter Variable', Inter, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .plate{
    width:1080px; height:1440px; position:relative; overflow:hidden;
    background:transparent;
  }

  /* Light scrim only — the image is the point, the label is furniture. */
  .scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(to top, rgba(7,11,9,.86) 0%, rgba(7,11,9,.55) 14%,
                              rgba(7,11,9,.00) 34%),
      linear-gradient(to bottom, rgba(7,11,9,.50) 0%, rgba(7,11,9,.00) 18%);
  }

  .brand{
    position:absolute; top:var(--TOP); left:var(--M);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:20px; font-weight:500; letter-spacing:.22em; text-transform:uppercase;
    color:var(--paper);
  }
  .brand span{ color:var(--accent); }

  .tag{
    position:absolute; left:var(--M); bottom:var(--BOT);
    display:inline-flex; align-items:center; gap:16px;
    padding:18px 28px; border:2px solid currentColor;
    background:rgba(7,11,9,.55);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:26px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  }
  /* A is stated plainly; B is the payoff, so it takes the emphasis colour. */
  #a .tag{ color:var(--paper); }
  #b .tag{ color:var(--accent2); }

  .dot{
    width:14px; height:14px; border-radius:50%;
    background:currentColor; flex:none;
  }
  #a .dot{ opacity:.45; }
</style>
</head>
<body>

<div class="plate" id="a">
  <div class="scrim"></div>
  <div class="brand">VAPORSWIFT<span>.</span>MEDIA</div>
  <div class="tag"><span class="dot"></span>The photo you already have</div>
</div>

<div class="plate" id="b">
  <div class="scrim"></div>
  <div class="brand">VAPORSWIFT<span>.</span>MEDIA</div>
  <div class="tag"><span class="dot"></span>One prompt later</div>
</div>

</body>
</html>
